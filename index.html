<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil Profesional</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }
        h2 {
            color: #16a085;
            font-size: 16px;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 20px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
        }
        .links {
            margin-top: 25px;
        }
        .btn {
            display: block;
            background: #2c3e50;
            color: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #16a085;
        }
    </style>
</head>
<body>
        transition: background 0.3s;
    }

    .btn:hover {
        background: #16a085;
    }
</style>
</head>
<body>

    <div class="card">
        <!-- REEMPLAZA LOS DATOS DE ABAJO CON LOS TUYOS -->
        <h1>Steven Alconada</h1>
        <h2>Estudiante de Emprendedurismo</h2>
        
        <p>¡Bienvenido a mi página personal! Este sitio está alojado en GitHub Pages como parte del trabajo integrador de la materia.</p>
        
        <div class="links">
            <!-- Poné los links reales de tus perfiles reemplazando el # -->
            <a href="https://linkedin.com" target="_blank" class="btn">Mi Perfil de LinkedIn</a>
            <a href="https://github.com" target="_blank" class="btn">Mi GitHub</a>
        </div>
    </div>

</body>
